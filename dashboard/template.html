<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back-office Automation Dashboard</title>
<meta name="description" content="Live demo: results of four back-office automations (hour bank, payroll check, e-invoices, portal robot) on one page, with one list of what people must fix.">
<style>
:root {
  --bg: #f5f7fb; --card: #ffffff; --text: #0f172a; --muted: #5b6478; --border: #e3e7ef;
  --accent: #2563eb; --accent-soft: #e8efff; --pos: #15803d; --neg: #c2410c; --track: #eef1f6;
  --error-bg: #fde2e1; --error: #9f1239; --warning-bg: #fef3c7; --warning: #92400e; --ok-bg: #dcfce7; --ok: #166534;
  --bar-pos: #22c55e; --bar-neg: #f97316; --bar: #3b82f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --card: #131d33; --text: #e7ecf5; --muted: #9aa6bd; --border: #23304b;
    --accent: #7aa2ff; --accent-soft: #1a2747; --pos: #4ade80; --neg: #fb923c; --track: #1b2740;
    --error-bg: #3b1219; --error: #fda4af; --warning-bg: #3a2a0b; --warning: #fcd34d; --ok-bg: #0f2e1c; --ok: #86efac;
    --bar-pos: #22c55e; --bar-neg: #fb923c; --bar: #60a5fa;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 56px; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 22px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
.tile .label { color: var(--muted); font-size: 13px; }
.tile .value { font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tile.hero { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
.tile.hero .label, .tile.hero .hint { color: rgba(255,255,255,.85); }
h2 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
h2 .count { color: var(--muted); font-weight: 500; }
.section { margin-top: 28px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.card h3 { margin: 0 0 2px; font-size: 15px; }
.card .meta { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.card .meta a { font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.filters button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.error, .failed, .missing { background: var(--error-bg); color: var(--error); }
.warning, .rejected, .review { background: var(--warning-bg); color: var(--warning); }
.ok, .done { background: var(--ok-bg); color: var(--ok); }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
.bars { display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 74px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.track { position: relative; height: 14px; background: var(--track); border-radius: 4px; }
.track .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.track.diverging::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .5; }
.stack { display: flex; height: 16px; border-radius: 6px; overflow: hidden; background: var(--track); margin: 4px 0 8px; }
.stack span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.empty { color: var(--muted); font-style: italic; }
.mini { margin-top: 14px; }
footer { margin-top: 36px; color: var(--muted); font-size: 13px; }
footer ul { margin: 6px 0 0; padding-left: 18px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .tiles { grid-template-columns: 1fr; } .bar-row { grid-template-columns: 96px 1fr 64px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <span class="pill">Live demo · fictional data</span>
      <h1 style="margin-top:8px">Back-office automation</h1>
      <p class="sub" id="subtitle"></p>
    </div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="section">
    <h2>To review <span class="count" id="action-count"></span></h2>
    <div class="card">
      <div class="filters" id="filters" role="group" aria-label="Filter by source"></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Severity</th><th>Source</th><th>Item</th><th>Issue</th><th>Details</th></tr></thead>
        <tbody id="actions"></tbody>
      </table></div>
    </div>
  </div>

  <div class="section grid2">
    <div class="card" id="hour-bank"></div>
    <div class="card" id="payroll"></div>
    <div class="card" id="einvoices"></div>
    <div class="card" id="robot"></div>
  </div>

  <footer id="footer"></footer>
</div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const REPO = "https://github.com/alelexand/";

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v;
      else if (k === "style") node.style.cssText = v;
      else node.setAttribute(k, v);
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined) continue;
      node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
  }
  const eur = v => (v < 0 ? "-" : "") + "€" + Math.abs(v).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const signedEur = v => (v > 0 ? "+" : "") + eur(v);
  const hhmm = h => { const m = Math.round(Math.abs(h) * 60); return (h < 0 ? "-" : h > 0 ? "+" : "") + String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
  const badge = s => el("span", { class: "badge " + s }, s);

  function header(card, title, repo, metaText) {
    card.append(el("h3", {}, title),
      el("p", { class: "meta" }, metaText + " · ", el("a", { href: REPO + repo, target: "_blank", rel: "noopener" }, repo)));
  }

  function bars(items, { diverging = false, format = String, color } = {}) {
    const max = Math.max(...items.map(i => Math.abs(i.value)), 1e-9);
    return el("div", { class: "bars" }, items.map(i => {
      const pct = Math.abs(i.value) / max * (diverging ? 50 : 100);
      const fillColor = color || (i.value < 0 ? "var(--bar-neg)" : "var(--bar-pos)");
      const pos = diverging ? (i.value < 0 ? `right:50%;width:${pct}%` : `left:50%;width:${pct}%`) : `left:0;width:${pct}%`;
      return el("div", { class: "bar-row" },
        el("span", { class: "name", title: i.label }, i.label),
        el("div", { class: "track" + (diverging ? " diverging" : "") }, el("div", { class: "fill", style: `${pos};background:${fillColor}` })),
        el("span", { class: "val", style: i.value < 0 ? "color:var(--neg)" : diverging && i.value > 0 ? "color:var(--pos)" : "" }, format(i.value)));
    }));
  }

  function empty(card, title, repo) {
    header(card, title, repo, "No data in this run");
    card.append(el("p", { class: "empty" }, "This source was not provided."));
  }

  // ----- header & tiles -----
  document.getElementById("subtitle").textContent =
    `${D.period ? D.period + " · " : ""}Updated ${D.generated_at} · four automations, one page`;

  const totalManual = Object.values(D.manual_hours).reduce((a, b) => a + b, 0);
  const errors = D.actions.filter(a => a.severity === "error").length;
  const warnings = D.actions.length - errors;
  const tiles = [
    { label: "Manual work replaced", value: `≈ ${totalManual.toFixed(1)} h`, hint: "this month, see assumptions below", hero: true },
    { label: "Items for a person to review", value: String(D.actions.length), hint: `${errors} errors · ${warnings} warnings` },
    D.hour_bank && { label: "Hour bank, total balance", value: hhmm(D.hour_bank.total_closing_h), hint: `${D.hour_bank.employees.length} employees` },
    D.payroll && { label: "Payroll difference to fix", value: signedEur(D.payroll.net_difference), hint: `${D.payroll.labels.join(" vs ")}` },
    D.einvoices && { label: "E-invoices to pay", value: eur(D.einvoices.total_due), hint: `${D.einvoices.ready} of ${D.einvoices.files} ready to book` },
    D.robot && { label: "Portal robot", value: `${D.robot.done} done`, hint: `${D.robot.rejected} rejected · ${D.robot.failed} failed · ${D.robot.retries} retries` },
  ].filter(Boolean);
  document.getElementById("tiles").append(...tiles.map(t =>
    el("div", { class: "tile" + (t.hero ? " hero" : "") },
      el("div", { class: "label" }, t.label), el("div", { class: "value" }, t.value), el("div", { class: "hint" }, t.hint))));

  // ----- action list -----
  const tbody = document.getElementById("actions");
  const sources = ["All", ...new Set(D.actions.map(a => a.source))];
  let current = "All";
  function renderActions() {
    const rows = D.actions.filter(a => current === "All" || a.source === current);
    tbody.replaceChildren(...(rows.length ? rows.map(a => el("tr", {},
      el("td", {}, badge(a.severity)), el("td", {}, a.source), el("td", {}, a.who || ""),
      el("td", {}, el("span", { class: "code" }, a.code)), el("td", {}, a.details || ""))) :
      [el("tr", {}, el("td", { colspan: "5", class: "empty" }, "Nothing to review."))]));
    document.getElementById("action-count").textContent = `(${rows.length})`;
  }
  const filters = document.getElementById("filters");
  filters.append(...sources.map(s => {
    const b = el("button", { type: "button", "aria-pressed": String(s === current) }, s);
    b.addEventListener("click", () => {
      current = s;
      filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      renderActions();
    });
    return b;
  }));
  renderActions();

  // ----- hour bank -----
  (function () {
    const card = document.getElementById("hour-bank");
    if (!D.hour_bank) return empty(card, "Hour bank", "hour-bank-checker");
    const h = D.hour_bank;
    header(card, "Hour bank", "hour-bank-checker", `Closing balance per employee · ${h.issues.length} issues found`);
    card.append(bars(h.employees.map(e => ({ label: e.name, value: e.closing_h })), { diverging: true, format: hhmm }));
  })();

  // ----- payroll -----
  (function () {
    const card = document.getElementById("payroll");
    if (!D.payroll) return empty(card, "Payroll check", "payroll-reconciliation");
    const p = D.payroll;
    const counts = { ok: 0, review: 0, missing: 0 };
    p.employees.forEach(e => { const k = e.status.toLowerCase().startsWith("missing") ? "missing" : e.status.toLowerCase(); counts[k] = (counts[k] || 0) + 1; });
    header(card, "Payroll check", "payroll-reconciliation", `${p.labels.join(" vs ")} · ${p.items_compared} pay items compared`);
    const total = p.employees.length || 1;
    card.append(
      el("div", { class: "stack", role: "img", "aria-label": `${counts.ok} matching, ${counts.review} to review, ${counts.missing} missing` },
        el("span", { style: `width:${counts.ok / total * 100}%;background:var(--bar-pos)` }),
        el("span", { style: `width:${counts.review / total * 100}%;background:#eab308` }),
        el("span", { style: `width:${counts.missing / total * 100}%;background:#ef4444` })),
      el("div", { class: "legend" },
        el("span", {}, el("i", { style: "background:var(--bar-pos)" }), `${counts.ok} match`),
        el("span", {}, el("i", { style: "background:#eab308" }), `${counts.review} to review`),
        el("span", {}, el("i", { style: "background:#ef4444" }), `${counts.missing} missing on one side`)));
    const diffs = p.employees.filter(e => Math.abs(e.net_difference) >= 0.005);
    card.append(el("p", { class: "meta mini" }, "Net pay difference per employee"),
      diffs.length ? bars(diffs.map(e => ({ label: e.name, value: e.net_difference })), { diverging: true, format: signedEur })
                   : el("p", { class: "empty" }, "No differences."));
  })();

  // ----- e-invoices -----
  (function () {
    const card = document.getElementById("einvoices");
    if (!D.einvoices) return empty(card, "E-invoices", "einvoice-reader");
    const e = D.einvoices;
    header(card, "E-invoices", "einvoice-reader", `${e.invoices.length} read of ${e.files} files · total per supplier, duplicates excluded`);
    card.append(bars(e.suppliers.map(s => ({ label: s.name, value: s.total })), { format: eur, color: "var(--bar)" }));
    card.append(el("p", { class: "meta mini" }, "VAT by rate"),
      el("div", { class: "table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Category"), el("th", {}, "Rate"), el("th", {}, "Taxable"), el("th", {}, "VAT"))),
        el("tbody", {}, e.vat.map(v => el("tr", {}, el("td", {}, v.category), el("td", {}, v.rate + "%"),
          el("td", {}, eur(v.taxable)), el("td", {}, eur(v.tax))))))));
  })();

  // ----- robot -----
  (function () {
    const card = document.getElementById("robot");
    if (!D.robot) return empty(card, "Portal robot", "portal-robot");
    const r = D.robot;
    const total = r.tasks.length || 1;
    header(card, "Portal robot", "portal-robot", `${r.tasks.length} portal tasks in ${r.seconds}s · ${r.retries} automatic retries`);
    card.append(
      el("div", { class: "stack", role: "img", "aria-label": `${r.done} done, ${r.rejected} rejected, ${r.failed} failed` },
        el("span", { style: `width:${r.done / total * 100}%;background:var(--bar-pos)` }),
        el("span", { style: `width:${r.rejected / total * 100}%;background:#eab308` }),
        el("span", { style: `width:${r.failed / total * 100}%;background:#ef4444` })),
      el("div", { class: "legend" },
        el("span", {}, el("i", { style: "background:var(--bar-pos)" }), `${r.done} done`),
        el("span", {}, el("i", { style: "background:#eab308" }), `${r.rejected} rejected by the portal`),
        el("span", {}, el("i", { style: "background:#ef4444" }), `${r.failed} failed`)),
      el("div", { class: "table-wrap mini" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Status"), el("th", {}, "Task"), el("th", {}, "Result"))),
        el("tbody", {}, r.tasks.map(t => el("tr", {}, el("td", {}, badge(t.status)), el("td", {}, t.item),
          el("td", {}, t.status === "done" ? t.result : t.details)))))));
  })();

  // ----- footer -----
  const a = D.assumptions;
  document.getElementById("footer").append(
    el("strong", {}, "How “manual work replaced” is estimated"),
    el("ul", {},
      el("li", {}, `Hour bank: ${a.minutes_per_employee_day} min per employee per day checked (${D.manual_hours["Hour bank"]} h)`),
      el("li", {}, `Payroll check: ${a.minutes_per_payroll_item} min per pay item compared (${D.manual_hours["Payroll check"]} h)`),
      el("li", {}, `E-invoices: ${a.minutes_per_invoice} min per invoice typed and checked (${D.manual_hours["E-invoices"]} h)`),
      el("li", {}, `Portal robot: ${a.minutes_per_portal_task} min per download or form (${D.manual_hours["Portal robot"]} h)`)),
    el("p", {}, "All people, companies and amounts are fictional. Built by ",
      el("a", { href: "https://alelexand.github.io" }, "Alexandre Lasse"), " · ",
      el("a", { href: REPO + "back-office-dashboard" }, "source code")));
})();
</script>
</body>
</html>
